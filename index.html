<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>FUNKENFLUG • Johanna Weber Edition v2.5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap');
        
        :root {
            --void: #0a0505;
            --deep: #1a0a0a;
            --crimson: #dc143c;
            --burgund: #800020;
            --gold: #d4af37;
            --obsidian: #0d0d0d;
            --silk: #e8e0d5;
            --emerald: #27ae60;
            --neon: #00ff88;
        }

        * { 
            margin:0; padding:0; box-sizing:border-box; 
            -webkit-tap-highlight-color:transparent; 
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body { 
            height:100%; overflow:hidden; 
            background:var(--void); color:var(--silk); 
            font-family:'Inter',sans-serif; 
            position:fixed; width:100%; 
            overscroll-behavior: none;
        }

        .screen { 
            position:absolute; inset:0; display:none; 
            flex-direction:column; 
            background:linear-gradient(135deg, var(--void) 0%, var(--deep) 100%); 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .screen.active { display:flex !important; }

        h1 { 
            font-family:'Cinzel',serif; 
            font-size:clamp(1.8rem,6vw,2.4rem); 
            color:var(--gold); 
            text-align:center; 
            letter-spacing:0.08em;
            text-shadow:0 0 25px rgba(212,175,55,0.4);
            margin: 1rem 0;
        }

        .watermark {
            position:fixed; bottom:18%; right:-110px; 
            font-size:10.5rem; font-weight:900; 
            color:#d4af37; opacity:0.045;
            transform:rotate(-17deg); pointer-events:none; 
            z-index:999; letter-spacing:-25px; 
            white-space:nowrap; font-family:system-ui;
        }

        /* AUTH */
        .auth-container { 
            flex:1; display:flex; flex-direction:column; 
            justify-content:center; align-items:center; 
            gap:1.5rem; padding:1.5rem; 
        }
        
        .code-input {
            width:min(220px,65vw); height:58px; 
            background:var(--obsidian); border:3px solid var(--gold);
            color:var(--gold); font-family:'Cinzel',serif; 
            font-size:16px; text-align:center; letter-spacing:12px;
            border-radius:12px; outline:none;
            -webkit-appearance: none;
        }

        .btn {
            background:linear-gradient(135deg, var(--burgund), var(--crimson)); 
            border:2px solid var(--gold); color:var(--silk);
            padding:16px 32px; font-family:'Cinzel',serif; 
            font-size:0.95rem; letter-spacing:2px; text-transform:uppercase;
            border-radius:10px; width:min(300px,85vw); min-height:52px; 
            cursor:pointer; transition:all 0.2s;
            position: relative; overflow: hidden;
        }
        .btn:active { transform:scale(0.97); }
        
        .btn-secondary {
            background: transparent; border: 2px solid rgba(232,224,213,0.4);
        }
        .btn-beta {
            position: fixed; bottom: max(20px, env(safe-area-inset-bottom));
            right: 20px; width: auto; padding: 8px 14px; font-size: 0.65rem;
            background: rgba(0,255,136,0.1); border: 1px solid var(--neon);
            color: var(--neon); opacity: 0.6;
        }
        .btn-add {
            background: rgba(212,175,55,0.1); border: 2px dashed var(--gold);
            color: var(--gold); width: 100%; margin-top: 0.5rem;
        }
        .btn-small { padding: 8px 16px; font-size: 0.75rem; width: auto; }

        /* PLAYER SETUP */
        .player-setup-container {
            flex: 1; display: flex; flex-direction: column;
            padding: 1.5rem 1rem; max-width: 500px; width: 100%; margin: 0 auto;
        }
        .player-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
        .player-input-row { display: flex; align-items: center; gap: 0.5rem; }
        .player-input {
            flex: 1; padding: 14px; background: #111; border: 2px solid #d4af37;
            color: #e8e0d5; border-radius: 10px; font-size: 16px; font-family: 'Inter', sans-serif;
        }
        .player-input.host {
            background: rgba(212,175,55,0.1); font-family: 'Cinzel', serif;
        }
        .player-remove {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(220,20,60,0.2); border: 1px solid var(--crimson);
            color: var(--crimson); display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 1.2rem;
        }
        .player-remove:disabled { opacity: 0; pointer-events: none; }

        /* DISCIPLINE GRID */
        .discipline-grid { 
            display:grid; grid-template-columns:1fr; gap:14px; 
            padding:1rem; flex:1; overflow-y:auto; 
        }
        @media (min-width:380px) { .discipline-grid { grid-template-columns:1fr 1fr; } }

        .discipline-card {
            background:linear-gradient(145deg,rgba(26,10,10,0.95),rgba(10,5,5,0.98)); 
            border:2px solid rgba(212,175,55,0.25);
            border-radius:14px; padding:1.25rem; text-align:center; 
            cursor:pointer; transition:all 0.3s; position: relative;
        }
        .discipline-card.locked { opacity:0.35; pointer-events:none; }
        .discipline-card.active { border-color:var(--gold); box-shadow:0 0 25px rgba(212,175,55,0.3); }

        /* SWIPE GAME */
        .swipe-screen { 
            position:fixed; inset:0; background:var(--void); 
            z-index:300; display:none; flex-direction:column; 
        }
        .swipe-screen.active { display:flex !important; }
        .swipe-area { 
            flex:1; position:relative; display:flex; 
            align-items:center; justify-content:center;
            touch-action: none; cursor: grab;
        }
        .swipe-arrow {
            font-size:6.5rem; color:var(--gold); 
            text-shadow:0 0 40px rgba(212,175,55,0.6); 
            transition:all 0.3s; opacity:0; transform: scale(0.8);
        }
        .swipe-arrow.show { opacity:1; transform:scale(1); }

        /* GAME HEADER */
        .game-header {
            background:rgba(26,10,10,0.98); padding:12px 16px; 
            display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid rgba(220,20,60,0.25); z-index:100;
        }
        .player-name { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.2rem; }
        .safe-word-btn {
            background:var(--crimson); padding:9px 18px; border:none; 
            color:white; font-weight:700; border-radius:6px;
            animation:pulse 1.8s infinite; font-size:0.8rem; cursor: pointer;
        }
        @keyframes pulse { 
            0%,100% { box-shadow:0 0 0 0 rgba(220,20,60,0.7); } 
            50% { box-shadow:0 0 0 12px rgba(220,20,60,0); } 
        }

        .task-card {
            background:linear-gradient(135deg,rgba(26,10,10,0.98),rgba(10,5,5,0.98)); 
            border:2px solid var(--gold); border-radius:14px; 
            padding:1.75rem 1.25rem; width:90%; max-width:420px; 
            margin: 1rem auto;
        }

        /* WHEEL */
        .wheel-container { 
            width:min(240px,62vw); height:min(240px,62vw); 
            position:relative; margin:1rem auto; 
        }
        .wheel {
            width:100%; height:100%; border-radius:50%; 
            border:8px solid var(--gold); position: relative; overflow:hidden;
            box-shadow:0 0 30px rgba(212,175,55,0.5);
        }
        .wheel-segment {
            position:absolute; width:50%; height:50%; 
            transform-origin:100% 100%; 
            left: 50%; top: 50%; margin-left: -50%; margin-top: -50%;
            display:flex; align-items:center; justify-content:center;
            font-family:'Cinzel',serif; font-size:0.75rem; font-weight:700; 
        }
        .segment-1 { background:var(--gold); transform:rotate(0deg); color: #000; }
        .segment-2 { background:var(--burgund); transform:rotate(90deg); color:#fff; }
        .segment-3 { background:#1a1a1a; transform:rotate(180deg); color:#fff; }
        .segment-4 { background:var(--crimson); transform:rotate(270deg); color:#fff; }
        .wheel-pointer {
            position:absolute; top:-15px; left:50%; 
            transform:translateX(-50%);
            border-left:16px solid transparent; border-right:16px solid transparent;
            border-top:32px solid var(--gold); z-index:20;
        }

        #intensityBar { display: none; gap: 16px; justify-content: center; margin: 1rem 0; }
        .intensity-dot {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid rgba(212,175,55,0.3); display: flex;
            align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 700; cursor: pointer;
            background: rgba(212,175,55,0.05);
        }
        .intensity-dot.active {
            border-color: var(--gold); background: var(--gold);
            color: var(--void);
        }

        .progress-container {
            position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); 
            left:50%; transform:translateX(-50%);
            width:min(92%,400px); background:rgba(0,0,0,0.85); 
            padding:12px; border-radius:18px;
            border:1px solid rgba(212,175,55,0.25); z-index:200;
        }
        .progress-step {
            flex: 1; height: 6px; background: rgba(212,175,55,0.15);
            border-radius: 3px;
        }
        .progress-step.completed { background: var(--gold); }

        #modeSelector {
            display:grid; grid-template-columns:1fr 1fr; gap:12px;
            width:90%; max-width:400px; margin: 0 auto;
        }
        #modeSelector > div {
            border: 1px solid rgba(212,175,55,0.2);
            font-family: 'Cinzel', serif; font-size: 0.85rem;
            padding: 1.2rem; border-radius: 12px; text-align: center; cursor: pointer;
        }
        #modeSelector > div.active { border-color: var(--gold); background: rgba(212,175,55,0.2); }
        #modeSelector > div.locked { opacity: 0.3; pointer-events: none; }

        /* MODAL */
        #successModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96);
            display: none; align-items: center; justify-content: center;
            z-index: 999;
        }
        #successModal.active { display: flex !important; }
        .modal-content {
            background: linear-gradient(145deg, #111, #0a0a0a);
            border: 2px solid var(--gold); max-width: 340px; width: 90%;
            padding: 2rem; border-radius: 14px; text-align: center;
        }

        .complete-btn {
            margin-top: 1.5rem; background: transparent;
            border: 2px solid var(--emerald); color: var(--emerald);
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-family: 'Cinzel', serif; width: 100%;
        }

        /* BETA SCREEN */
        .beta-screen { background: rgba(0,20,10,0.95) !important; }
        .testing-header {
            background: rgba(0,255,136,0.05); border-bottom: 1px solid rgba(0,255,136,0.2);
            padding: 16px; display: flex; justify-content: space-between;
        }
        .testing-title { font-family: 'Fira Code', monospace; color: var(--neon); }
        .bot-log {
            font-family: 'Fira Code', monospace; font-size: 0.7rem;
            color: rgba(0,255,136,0.8); padding: 4px 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="watermark">FUNKENFLUG</div>

    <!-- AUTH SCREEN -->
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <h1>FUNKENFLUG</h1>
            <div style="text-align:center;opacity:0.7;margin-bottom:20px;">Johanna Weber Edition</div>
            <input type="text" id="accessCode" class="code-input" placeholder="CODE" maxlength="8" autocomplete="off">
            <button class="btn" onclick="window.authenticate()">ZUGANG</button>
            <button class="btn btn-secondary" onclick="window.startDemo()">DEMO</button>
        </div>
        <button class="btn btn-beta" onclick="window.enterBeta()">TSTBT BETA</button>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setupScreen" class="screen">
        <div style="padding:1.5rem;text-align:center;"><h1>Spielerinnen</h1></div>
        <div class="player-setup-container">
            <div class="player-list" id="playerList"></div>
            <div style="text-align:center;color:rgba(232,224,213,0.5);font-size:0.8rem;margin:0.5rem 0;" id="playerCounter"></div>
            <button onclick="window.addPlayer()" class="btn btn-add">+ SPIELERIN HINZUFÜGEN</button>
            <button onclick="window.startGameSetup()" class="btn" style="margin-top:2rem;">SPIEL STARTEN</button>
        </div>
    </div>

    <!-- DISCIPLINE SCREEN -->
    <div id="disciplineScreen" class="screen">
        <div style="padding:1.5rem;text-align:center;"><h1>Disziplinen</h1></div>
        <div class="discipline-grid" id="disciplineGrid"></div>
    </div>

    <!-- SWIPE GAME SCREEN -->
    <div id="swipeScreen" class="swipe-screen">
        <div class="game-header">
            <div><div style="font-size:0.65rem;color:rgba(232,224,213,0.5);">Aktuelle Spielerin</div>
            <div id="swipePlayerName" class="player-name">—</div></div>
            <button onclick="window.triggerSafeWord()" class="safe-word-btn">SAFE WORD</button>
        </div>
        <div class="swipe-area" id="swipeArea">
            <div style="text-align:center;">
                <div id="swipeArrow" class="swipe-arrow show">↑</div>
                <div style="color:var(--gold);margin-top:1rem;font-family:Cinzel;" id="swipeProgress">0 / 5</div>
            </div>
        </div>
    </div>

    <!-- QUIZ SCREEN (Modal-like) -->
    <div id="quizScreen" class="screen" style="z-index:400;">
        <div class="game-header">
            <div class="player-name">WISSENSTEST</div>
            <button onclick="window.triggerSafeWord()" class="safe-word-btn">SAFE WORD</button>
        </div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;">
            <div class="task-card" id="quizCard" style="width:100%;">
                <div id="quizQuestion" style="font-size:1.2rem;margin-bottom:1.5rem;"></div>
                <div id="quizAnswers"></div>
            </div>
        </div>
    </div>

    <!-- CASINO SCREEN -->
    <div id="casinoScreen" class="screen" style="z-index:400;">
        <div class="game-header">
            <div class="player-name">RISIKO</div>
            <button onclick="window.triggerSafeWord()" class="safe-word-btn">SAFE WORD</button>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
            <div class="task-card" style="text-align:center;">
                <div style="font-size:3rem;margin-bottom:1rem;">🎲</div>
                <div id="casinoResult" style="font-size:1.5rem;margin-bottom:1rem;">Bereit...</div>
                <button onclick="window.spinCasino()" class="btn" id="casinoBtn" style="width:200px;">ZIEHEN</button>
            </div>
        </div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <div>
                <div style="font-size:0.65rem;color:rgba(232,224,213,0.5);">Aktuelle Spielerin</div>
                <div id="currentPlayerName" class="player-name">—</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div id="playerAvatars" style="display:flex;margin-right:10px;"></div>
                <button onclick="window.triggerSafeWord()" class="safe-word-btn">SAFE WORD</button>
            </div>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;align-items:center;padding:1rem;gap:1rem;overflow-y:auto;">
            <div id="modeSelector"></div>

            <div id="intensityBar">
                <div class="intensity-dot active" onclick="window.setIntensity(1)">I</div>
                <div class="intensity-dot" onclick="window.setIntensity(2)">II</div>
                <div class="intensity-dot" onclick="window.setIntensity(3)">III</div>
            </div>

            <div id="taskCard" class="task-card" style="display:none;">
                <div id="taskCategory" style="color:#d4af37;font-size:0.75rem;letter-spacing:2px;margin-bottom:0.75rem;text-transform:uppercase;"></div>
                <div id="taskText" style="font-size:1.1rem;line-height:1.6;margin-bottom:1.5rem;"></div>
                <button onclick="window.completeTask()" class="complete-btn">AUFGABE ABGESCHLOSSEN</button>
            </div>

            <div id="wheelContainer" style="display:none;width:100%;text-align:center;">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel">
                        <div class="wheel-segment segment-1">GOLD</div>
                        <div class="wheel-segment segment-2">BURGUND</div>
                        <div class="wheel-segment segment-3">SCHWARZ</div>
                        <div class="wheel-segment segment-4">CRIMSON</div>
                    </div>
                </div>
                <button id="spinBtn" onclick="window.spinWheel()" class="btn" style="margin-top:1.5rem;background:linear-gradient(135deg,var(--gold),#b8941f);color:#000;">DREHEN</button>
            </div>

            <div id="nextPlayerHint" style="display:none;color:rgba(232,224,213,0.6);font-style:italic;">
                Nächste: <b id="nextPlayerName" style="color:var(--gold);"></b>
            </div>
        </div>

        <div class="progress-container">
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <div id="prog1" class="progress-step"></div>
                <div id="prog2" class="progress-step"></div>
                <div id="prog3" class="progress-step"></div>
                <div id="prog4" class="progress-step"></div>
            </div>
            <div id="statusLine" style="text-align:center;font-size:0.75rem;color:#d4af37;font-family:Cinzel;">Wähle eine Disziplin</div>
        </div>
    </div>

    <!-- BETA SCREEN -->
    <div id="betaScreen" class="screen beta-screen">
        <div class="testing-header">
            <div class="testing-title">⚡ TSTBT • BOT ARMY</div>
            <div style="font-family:Fira Code;font-size:0.7rem;color:var(--neon);">30 UNITS</div>
        </div>
        <div style="flex:1;overflow-y:auto;padding:12px;">
            <div id="botLogs" style="background:rgba(0,0,0,0.3);padding:10px;border-radius:8px;min-height:200px;">
                <div class="bot-log">System initialized...</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
                <button class="btn btn-small" onclick="window.runTest('swipe')">Test: Swipe</button>
                <button class="btn btn-small" onclick="window.runTest('full')">Test: Full</button>
            </div>
        </div>
        <button class="btn" onclick="window.showScreen('authScreen')" style="margin:12px;">ZURÜCK</button>
    </div>

    <!-- MODAL -->
    <div id="successModal" data-closeable="true" onclick="if(event.target===this && this.dataset.closeable==='true')window.closeModal()">
        <div class="modal-content">
            <div id="modalTitle" style="color:#d4af37;font-family:Cinzel;font-size:1.6rem;margin-bottom:1rem;"></div>
            <div id="modalText" style="margin-bottom:2rem;line-height:1.6;"></div>
            <button id="modalBtn" onclick="window.closeModal()" class="btn" style="width:100%;">WEITER</button>
        </div>
    </div>

<script>
// ====================== CONFIG ======================
window.CONFIG = {
    fullAccessCode: '26101908',
    betaCode: 'TSTBT',
    minPlayers: 2,
    maxPlayers: 8
};

// ====================== STATE ======================
window.gameState = {
    fullAccess: false, betaMode: false, players: [], currentPlayerIndex: 0,
    completedDisciplines: [], unlockedModes: [], currentMode: null,
    currentIntensity: 1, wheelAngle: 0, turnCount: 1, pendingAfterModal: null
};

window.swipeState = { count: 0, target: null, startX: 0, startY: 0, active: false };

// ====================== DATA ======================
window.taskDB = {
    geschenkband: {
        1: ["Die Gastgeberin beschreibt laut, wie sie dich dekorieren würde – ohne Berührung.","Verbundene Augen + nur verbale Dekoration durch die Gruppe.","Du stehst 30 Sekunden still und wirst nur mit Worten geschmückt."],

    },
    inspektion: {
        1: ["30 Sekunden nur visuelle Betrachtung – keine Berührung erlaubt.","Die Gruppe beschreibt laut, was sie an dir beobachtet.","Stimmverzerrung aktiv – du erkennst nicht, wer spricht."],
        2: ["5 Minuten absolute Bewegungslosigkeit bei Konsequenz.","Detaillierte verbale Beschreibung geplanter Handlungen.","Kommunikation nur durch Augenkontakt erlaubt."],
        3: ["Vollständiges Bewegungsverbot – jede Regung = Zeitbonus.","Anonyme Stimmen + präzise Körperanalyse von außen.","Du darfst nur mit „Ja, Johanna" oder „Nein, Johanna" antworten."]
    },
    trio: {
        1: ["Alle anderen müssen sich einig sein, bevor ein Befehl erteilt wird.","Wette: Wer bringt dich als Erste zum Lächeln?","Synchronisierte Kommandos von zwei Stimmen gleichzeitig."],
        2: ["Wette: Wer schafft es, dich schneller zum Stöhnen zu bringen?","Eine hält dich von hinten fest, die andere agiert von vorne.","Wechselnde Rollen alle 60 Sekunden."],
        3: ["Verschwörung: Du wirst von hinten gehalten und siehst nur eine Person.","Zwei dürfen dich gleichzeitig berühren – du weißt nicht wer wo.","Doppelte Befehle – nur die Stimme der Gastgeberin zählt."]
    },
    kontrolle: {
        1: ["90 Sekunden Stimulation, dann 30 Sekunden Pause.","Du darfst 3 Minuten nicht kommen – Gastgeberin entscheidet über Erlaubnis.","Langsames Hochfahren und abruptes Stoppen auf Kommando."],
        2: ["Dreimal Edging mit 15 Sekunden Pause dazwischen.","10 Minuten Stimulation ohne Erlaubnis zum Höhepunkt.","Präzises Stoppen im letzten Moment durch akustisches Signal."],
        3: ["Dreimal Edging mit zufälligen Pausen (10–30s).","15 Minuten totale Verweigerung – exakter Zeitpunkt wird bestimmt.","Synchrone Kontrolle durch zwei andere Spielerinnen."]
    }
};

window.wheelResults = [
    {label:"GOLD", text:"Gastgeberin bestimmt die nächste Aufgabe exklusiv."},
    {label:"BURGUND", text:"Freifahrt – Du wählst selbst Intensität und Art."},
    {label:"SCHWARZ", text:"Rollentausch – Du wirst Beobachterin für eine Runde."},
    {label:"CRIMSON", text:"Intensität +1 (max. 3) • Sofortige Anwendung"}
];

// ====================== UTILS ======================
window.escapeHtml = function(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};

window.showScreen = function(id) {
    document.querySelectorAll('.screen').forEach(s => {
        s.classList.remove('active');
        s.style.display = 'none';
    });
    const target = document.getElementById(id);
    if (target) {
        target.classList.add('active');
        target.style.display = 'flex';
    }
};

window.showModal = function(title, text, closeable = true) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').innerHTML = text;
    document.getElementById('modalBtn').style.display = closeable ? 'block' : 'none';
    document.getElementById('successModal').dataset.closeable = closeable ? 'true' : 'false';
    document.getElementById('successModal').classList.add('active');
    document.getElementById('successModal').style.display = 'flex';
};

window.closeModal = function() {
    document.getElementById('successModal').classList.remove('active');
    document.getElementById('successModal').style.display = 'none';
    if (typeof window.gameState.pendingAfterModal === 'function') {
        const fn = window.gameState.pendingAfterModal;
        window.gameState.pendingAfterModal = null;
        setTimeout(fn, 50);
    }
};

// ====================== AUTH ======================
window.authenticate = function() {
    const input = document.getElementById('accessCode').value;
    if (input === window.CONFIG.fullAccessCode) {
        window.gameState.fullAccess = true;
        try { localStorage.setItem('ff_access', 'full'); } catch(e) {}
        window.initSetup();
    } else if (input === window.CONFIG.betaCode) {
        window.enterBeta();
    } else {
        const btn = document.querySelector('#authScreen .btn');
        btn.style.animation = 'shake 0.5s';
        setTimeout(() => btn.style.animation = '', 500);
        window.showModal("Falscher Code", "Demo oder Beta verfügbar.");
    }
};

window.startDemo = function() {
    window.gameState.fullAccess = false;
    try { localStorage.setItem('ff_access', 'demo'); } catch(e) {}
    window.initSetup();
};

window.enterBeta = function() {
    window.gameState.betaMode = true;
    try { localStorage.setItem('ff_access', 'beta'); } catch(e) {}
    window.showScreen('betaScreen');
};

// ====================== SETUP ======================
window.initSetup = function() {
    window.showScreen('setupScreen');
    window.gameState.players = ["Johanna", ""];
    window.renderPlayers();
};

window.renderPlayers = function() {
    const list = document.getElementById('playerList');
    const counter = document.getElementById('playerCounter');
    list.innerHTML = window.gameState.players.map((name, idx) => {
        const isHost = idx === 0;
        const canRemove = window.gameState.players.length > window.CONFIG.minPlayers && !isHost;
        return `
        <div class="player-input-row">
            <input type="text" class="player-input ${isHost ? 'host' : ''}" value="${window.escapeHtml(name)}"
                   placeholder="${isHost ? 'Gastgeberin' : 'Spielerin ' + (idx + 1)}"
                   onchange="window.gameState.players[${idx}] = this.value"
                   autocomplete="off">
            <button class="player-remove" onclick="window.removePlayer(${idx})" 
                    ${!canRemove ? 'disabled' : ''} 
                    style="${!canRemove ? 'opacity:0;pointer-events:none;' : ''}">×</button>
        </div>`;
    }).join('');
    counter.textContent = `${window.gameState.players.length} Spielerinnen (min. ${window.CONFIG.minPlayers})`;
};

window.addPlayer = function() {
    if (window.gameState.players.length < window.CONFIG.maxPlayers) {
        window.gameState.players.push("");
        window.renderPlayers();
    }
};

window.removePlayer = function(idx) {
    if (window.gameState.players.length > window.CONFIG.minPlayers && idx !== 0) {
        window.gameState.players.splice(idx, 1);
        window.renderPlayers();
    }
};

window.startGameSetup = function() {
    document.querySelectorAll('.player-input').forEach((el, i) => {
        window.gameState.players[i] = el.value.trim();
    });
    const filled = window.gameState.players.filter(p => p.trim() !== '').length;
    if (filled < window.CONFIG.minPlayers) {
        window.showModal("Zu wenig Spielerinnen", `Mindestens ${window.CONFIG.minPlayers} Namen eingeben.`);
        return;
    }
    window.gameState.players = window.gameState.players.map((p, i) => p.trim() === '' ? `Spielerin ${i + 1}` : p.trim());
    window.gameState.currentPlayerIndex = window.gameState.players.length > 1 ? 1 : 0;
    window.gameState.turnCount = 1;
    window.showScreen('disciplineScreen');
    window.renderDisciplines();
    window.updateProgress();
};

// ====================== DISCIPLINES ======================
window.renderDisciplines = function() {
    const grid = document.getElementById('disciplineGrid');
    const disciplines = [
        {id: 1, name: "Swipe-Test", unlocks: "Geschenkband", req: 0},
        {id: 2, name: "Wissen", unlocks: "Inspektion", req: 1},
        {id: 3, name: "Risiko", unlocks: "Trio", req: 2},
        {id: 4, name: "Ultima", unlocks: "Alle Modi", req: 3, special: true}
    ];

    grid.innerHTML = disciplines.map(d => {
        const completed = window.gameState.completedDisciplines.includes(d.id);
        const locked = d.id === 1 ? false : 
                      d.id === 2 ? !window.gameState.completedDisciplines.includes(1) :
                      d.id === 3 ? !window.gameState.completedDisciplines.includes(2) :
                      !(window.gameState.fullAccess || window.gameState.completedDisciplines.length >= 3);
        
        return `
        <div class="discipline-card ${completed ? 'active' : ''} ${locked ? 'locked' : ''}" 
             onclick="${locked ? '' : `window.startDiscipline(${d.id})`}">
            <div style="font-family:Cinzel;font-size:1.8rem;">${d.id}</div>
            <div style="font-size:1rem;letter-spacing:1px;">${d.name}</div>
            <div style="font-size:0.7rem;opacity:0.6;">
                ${d.special && !window.gameState.fullAccess && !completed ? 'Code erforderlich' : 
                  completed ? '✓ Abgeschlossen' : `Freischaltet: ${d.unlocks}`}
            </div>
        </div>`;
    }).join('');
};

window.startDiscipline = function(n) {
    if (n === 1) window.initSwipeGame();
    else if (n === 2) window.initQuiz();
    else if (n === 3) window.initCasino();
    else if (n === 4) { window.unlockAllModes(); window.startMainGame(); }
};

window.completeDiscipline = function(n) {
    if (!window.gameState.completedDisciplines.includes(n)) {
        window.gameState.completedDisciplines.push(n);
    }
    if (n === 1) window.gameState.unlockedModes.push('geschenkband');
    if (n === 2) window.gameState.unlockedModes.push('inspektion');
    if (n === 3) { window.gameState.unlockedModes.push('trio'); window.gameState.unlockedModes.push('kontrolle'); }
    window.renderDisciplines();
    window.updateProgress();
    const names = ["", "Swipe-Test", "Wissen", "Risiko", "Ultima"];
    window.gameState.pendingAfterModal = () => window.startMainGame();
    window.showModal(`Disziplin ${n} gemeistert`, `„${names[n]}" abgeschlossen. Neue Modi verfügbar.`);
};

// ====================== SWIPE GAME ======================
window.initSwipeGame = function() {
    window.swipeState = { count: 0, target: null, startX: 0, startY: 0, active: true };
    const screen = document.getElementById('swipeScreen');
    screen.classList.add('active');
    screen.style.display = 'flex';
    document.getElementById('swipePlayerName').textContent = window.gameState.players[window.gameState.currentPlayerIndex] || '—';
    
    const area = document.getElementById('swipeArea');
    area.addEventListener('touchstart', window.handleTouchStart, {passive: false});
    area.addEventListener('touchend', window.handleTouchEnd, {passive: false});
    area.addEventListener('mousedown', window.handleMouseDown);
    area.addEventListener('mouseup', window.handleMouseUp);
    
    window.nextSwipeRound();
};

window.nextSwipeRound = function() {
    if (!window.swipeState.active || window.swipeState.count >= 5) {
        if (window.swipeState.active) {
            setTimeout(() => {
                window.endSwipeGame();
                window.completeDiscipline(1);
            }, 500);
        }
        return;
    }
    const dirs = ['up', 'right', 'down', 'left'];
    const arrows = ['↑', '→', '↓', '←'];
    const idx = Math.floor(Math.random() * 4);
    window.swipeState.target = dirs[idx];
    document.getElementById('swipeArrow').textContent = arrows[idx];
    document.getElementById('swipeArrow').classList.add('show');
    document.getElementById('swipeProgress').textContent = `${window.swipeState.count} / 5`;
};

window.handleTouchStart = function(e) {
    e.preventDefault();
    window.swipeState.startX = e.changedTouches[0].screenX;
    window.swipeState.startY = e.changedTouches[0].screenY;
};

window.handleTouchEnd = function(e) {
    e.preventDefault();
    const dx = e.changedTouches[0].screenX - window.swipeState.startX;
    const dy = e.changedTouches[0].screenY - window.swipeState.startY;
    window.checkSwipe(dx, dy);
};

window.handleMouseDown = function(e) {
    window.swipeState.startX = e.clientX;
    window.swipeState.startY = e.clientY;
    window.swipeState.isMouseDown = true;
};

window.handleMouseUp = function(e) {
    if (!window.swipeState.isMouseDown) return;
    window.swipeState.isMouseDown = false;
    const dx = e.clientX - window.swipeState.startX;
    const dy = e.clientY - window.swipeState.startY;
    window.checkSwipe(dx, dy);
};

window.checkSwipe = function(dx, dy) {
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    if (dir === window.swipeState.target) {
        window.swipeState.count++;
        document.getElementById('swipeArrow').classList.remove('show');
        setTimeout(window.nextSwipeRound, 300);
    } else {
        document.getElementById('swipeArrow').style.color = '#dc143c';
        setTimeout(() => {
            document.getElementById('swipeArrow').style.color = '';
        }, 300);
    }
};

window.endSwipeGame = function() {
    window.swipeState.active = false;
    const screen = document.getElementById('swipeScreen');
    screen.classList.remove('active');
    screen.style.display = 'none';
    const area = document.getElementById('swipeArea');
    area.removeEventListener('touchstart', window.handleTouchStart);
    area.removeEventListener('touchend', window.handleTouchEnd);
    area.removeEventListener('mousedown', window.handleMouseDown);
    area.removeEventListener('mouseup', window.handleMouseUp);
};

// ====================== QUIZ ======================
window.initQuiz = function() {
    window.showScreen('quizScreen');
    window.quizCorrect = 0;
    window.quizCurrent = 0;
    window.quizQuestions = [
        {q: "Was ist die Safeword-Regel?", a: ["Stop sofort", "Weitermachen", "Pause"], correct: 0},
        {q: "Wer bestimmt bei GOLD?", a: ["Gastgeberin", "Gast", "Würfel"], correct: 0},
        {q: "Maximale Intensität?", a: ["III", "II", "I"], correct: 0}
    ];
    window.showQuizQuestion();
};

window.showQuizQuestion = function() {
    if (window.quizCurrent >= 3) {
        if (window.quizCorrect >= 2) {
            window.gameState.pendingAfterModal = null;
            window.completeDiscipline(2);
        } else {
            window.gameState.pendingAfterModal = () => window.initQuiz();
            window.showModal("Nicht bestanden", `Nur ${window.quizCorrect}/3 richtig. Wiederholen?`);
        }
        return;
    }
    const q = window.quizQuestions[window.quizCurrent];
    document.getElementById('quizQuestion').textContent = q.q;
    document.getElementById('quizAnswers').innerHTML = q.a.map((ans, idx) => 
        `<button onclick="window.answerQuiz(${idx === q.correct})" class="btn" style="width:100%;margin-bottom:8px;font-size:0.9rem;">${ans}</button>`
    ).join('');
};

window.answerQuiz = function(isCorrect) {
    if (isCorrect) window.quizCorrect++;
    window.quizCurrent++;
    window.showQuizQuestion();
};

// ====================== CASINO ======================
window.initCasino = function() {
    window.showScreen('casinoScreen');
    document.getElementById('casinoResult').innerHTML = 'Bereit zu ziehen...<br><br>Benötigt: Summe ≥ 10';
    document.getElementById('casinoBtn').style.display = 'block';
};

window.spinCasino = function() {
    const c1 = Math.floor(Math.random() * 10) + 1;
    const c2 = Math.floor(Math.random() * 10) + 1;
    const sum = c1 + c2;
    const win = sum >= 10;
    const color = win ? 'var(--emerald)' : '#dc143c';
    document.getElementById('casinoResult').innerHTML = 
        `${c1} + ${c2} = <b style="color:${color};font-size:2rem;">${sum}</b><br><br>` +
        (win ? '✓ Bestanden!' : '✗ Zu niedrig – nochmals versuchen');
    document.getElementById('casinoBtn').style.display = win ? 'none' : 'block';
    if (win) {
        setTimeout(() => {
            window.completeDiscipline(3);
        }, 1500);
    }
};

// ====================== MAIN GAME ======================
window.unlockAllModes = function() {
    window.gameState.unlockedModes = ['geschenkband', 'inspektion', 'trio', 'kontrolle'];
};

window.startMainGame = function() {
    window.showScreen('gameScreen');
    window.updatePlayerDisplay();
    window.renderModeSelector();
    window.updateProgress();
    document.getElementById('statusLine').textContent = "Wähle einen Modus";
    document.getElementById('taskCard').style.display = 'none';
    document.getElementById('wheelContainer').style.display = 'none';
    document.getElementById('nextPlayerHint').style.display = 'none';
    document.getElementById('intensityBar').style.display = 'none';
};

window.updatePlayerDisplay = function() {
    const current = window.gameState.players[window.gameState.currentPlayerIndex] || '—';
    document.getElementById('currentPlayerName').innerHTML = 
        `${window.escapeHtml(current)}<span style="font-size:0.6rem;color:rgba(212,175,55,0.7);margin-left:8px;">Zug ${window.gameState.turnCount}</span>`;
    
    document.getElementById('playerAvatars').innerHTML = window.gameState.players.map((name, idx) => {
        const active = idx === window.gameState.currentPlayerIndex;
        return `<div style="width:32px;height:32px;border-radius:50%;background:${active ? 'var(--gold)' : 'var(--burgund)'};color:${active ? '#000' : '#fff'};display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;margin-left:-8px;border:2px solid var(--gold);z-index:${active ? 10 : 1};">${name.charAt(0)}</div>`;
    }).join('');
    
    const nextIdx = (window.gameState.currentPlayerIndex + 1) % window.gameState.players.length;
    document.getElementById('nextPlayerName').textContent = window.gameState.players[nextIdx] || '';
};

window.renderModeSelector = function() {
    const container = document.getElementById('modeSelector');
    const modes = [
        {id: 'geschenkband', name: 'GESCHENKBAND', icon: '🎀'},
        {id: 'inspektion', name: 'INSPEKTION', icon: '👁'},
        {id: 'trio', name: 'TRIO', icon: '☰'},
        {id: 'kontrolle', name: 'KONTROLLE', icon: '◉'}
    ];

    container.innerHTML = modes.map(m => {
        const unlocked = window.gameState.unlockedModes.includes(m.id);
        const available = unlocked && (m.id !== 'trio' || window.gameState.players.length >= 3);
        const active = window.gameState.currentMode === m.id;
        return `
        <div onclick="${available ? `window.selectMode('${m.id}')` : ''}" 
             style="${active ? 'border-color:var(--gold);background:rgba(212,175,55,0.2);' : ''}${!available ? 'opacity:0.3;pointer-events:none;' : ''}padding:1rem;border:1px solid rgba(212,175,55,0.3);border-radius:8px;text-align:center;cursor:pointer;">
            <div style="font-size:1.5rem;">${m.icon}</div>
            <div style="font-family:Cinzel;font-size:0.8rem;">${m.name}</div>
            ${m.id === 'trio' && window.gameState.players.length < 3 ? '<div style="font-size:0.6rem;color:#dc143c;">3+ nötig</div>' : ''}
        </div>`;
    }).join('');
};

window.selectMode = function(mode) {
    window.gameState.currentMode = mode;
    window.renderModeSelector();
    document.getElementById('taskCard').style.display = 'block';
    document.getElementById('wheelContainer').style.display = 'none';
    document.getElementById('nextPlayerHint').style.display = 'none';
    document.getElementById('intensityBar').style.display = 'flex';
    window.gameState.currentIntensity = 1;
    window.updateIntensityDisplay();
    window.loadTask();
    const names = {geschenkband: 'GESCHENKBAND', inspektion: 'INSPEKTION', trio: 'TRIO', kontrolle: 'KONTROLLE'};
    document.getElementById('statusLine').textContent = `${names[mode]} • ${window.gameState.players[window.gameState.currentPlayerIndex]} ist dran`;
};

window.updateIntensityDisplay = function() {
    document.querySelectorAll('.intensity-dot').forEach((el, i) => {
        el.classList.toggle('active', i + 1 === window.gameState.currentIntensity);
    });
};

window.setIntensity = function(lvl) {
    window.gameState.currentIntensity = lvl;
    window.updateIntensityDisplay();
    window.loadTask();
};

window.loadTask = function() {
    const mode = window.gameState.currentMode;
    const intensity = window.gameState.currentIntensity;
    if (!window.taskDB[mode] || !window.taskDB[mode][intensity]) return;
    
    const pool = window.taskDB[mode][intensity];
    let task = pool[Math.floor(Math.random() * pool.length)];
    
    if (mode === 'trio' && window.gameState.players.length > 3) {
        const others = window.gameState.players.filter((_, i) => i !== window.gameState.currentPlayerIndex);
        const selected = others.sort(() => Math.random() - 0.5).slice(0, 2);
        task += `<br><br><span style="color:var(--gold);font-size:0.85rem;">Mit: ${selected.join(', ')}</span>`;
    }
    
    document.getElementById('taskCategory').textContent = `${mode.toUpperCase()} • STUFE ${['I','II','III'][intensity-1]}`;
    document.getElementById('taskText').innerHTML = task;
};

window.completeTask = function() {
    const btn = document.querySelector('.complete-btn');
    btn.innerHTML = '✓ ABGESCHLOSSEN';
    btn.style.background = 'var(--emerald)';
    btn.style.color = '#000';
    setTimeout(() => {
        document.getElementById('wheelContainer').style.display = 'block';
        document.getElementById('nextPlayerHint').style.display = 'block';
        document.getElementById('taskCard').style.display = 'none';
        btn.innerHTML = 'AUFGABE ABGESCHLOSSEN';
        btn.style.background = 'transparent';
        btn.style.color = 'var(--emerald)';
    }, 800);
};

window.spinWheel = function() {
    const wheel = document.getElementById('wheel');
    const btn = document.getElementById('spinBtn');
    btn.disabled = true;
    const target = Math.floor(Math.random() * 4);
    const spins = 5 + Math.floor(Math.random() * 4);
    const segmentDeg = target * 90 + 45;
    const added = spins * 360 + segmentDeg;
    window.gameState.wheelAngle = (window.gameState.wheelAngle + added) % 3600;
    
    wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
    wheel.style.transform = `rotate(${window.gameState.wheelAngle}deg)`;
    
    setTimeout(() => {
        const res = window.wheelResults[target];
        if (res.label === "CRIMSON" && window.gameState.currentIntensity < 3) {
            window.gameState.currentIntensity++;
            window.updateIntensityDisplay();
        }
        window.gameState.pendingAfterModal = () => {
            window.nextPlayer();
            window.renderModeSelector();
            document.getElementById('wheelContainer').style.display = 'none';
            document.getElementById('nextPlayerHint').style.display = 'none';
            document.getElementById('taskCard').style.display = 'block';
            window.loadTask();
            btn.disabled = false;
        };
        window.showModal(res.label, res.text);
    }, 4200);
};

window.nextPlayer = function() {
    window.gameState.currentPlayerIndex = (window.gameState.currentPlayerIndex + 1) % window.gameState.players.length;
    if (window.gameState.currentPlayerIndex === 0) window.gameState.turnCount++;
    window.updatePlayerDisplay();
};

// ====================== SYSTEM ======================
window.updateProgress = function() {
    [1,2,3,4].forEach(i => {
        const el = document.getElementById('prog' + i);
        el.classList.toggle('completed', window.gameState.completedDisciplines.includes(i));
    });
};

window.triggerSafeWord = function() {
    if (window.swipeState.active) window.endSwipeGame();
    window.gameState.pendingAfterModal = null;
    window.showModal("SAFE WORD", "Sofortiger Stopp. 5 Minuten Pause empfohlen.");
};

// ====================== BETA TESTING ======================
window.runTest = function(type) {
    const log = document.getElementById('botLogs');
    log.innerHTML += `<div class="bot-log">[${new Date().toLocaleTimeString()}] Test ${type} gestartet...</div>`;
    let count = 0;
    const interval = setInterval(() => {
        count++;
        log.innerHTML += `<div class="bot-log">Bot ${count} simuliert...</div>`;
        log.scrollTop = log.scrollHeight;
        if (count >= 5) clearInterval(interval);
    }, 500);
};

// ====================== INIT ======================
window.onload = function() {
    console.log('FUNKENFLUG v2.5 geladen');
    try {
        const saved = localStorage.getItem('ff_access');
        if (saved === 'full') window.gameState.fullAccess = true;
        if (saved === 'beta') window.gameState.betaMode = true;
    } catch(e) {}
};
